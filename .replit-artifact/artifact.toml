kind = "web"
previewPath = "/"
title = "공영홈쇼핑 입점 가이드"
version = "1.0.0"
id = "artifacts/homeshopping-guide"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22681

[services.development]
run = "pnpm --filter @workspace/homeshopping-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homeshopping-guide", "run", "build" ]
publicDir = "artifacts/homeshopping-guide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22681"
BASE_PATH = "/"
